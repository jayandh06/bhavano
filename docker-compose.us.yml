# The US stack, for its own host (docs/plans/us-stack-setup.md): the same app as India, running with MARKET=us and its own database (a separate DB instance, like India's: no Postgres container here), photo bucket,
# keys, cookies and API address. Nothing here is shared with docker-compose.prod.yml: a different host, project name (bhavano-us), images and .env.
#   docker compose -p bhavano-us -f docker-compose.us.yml --env-file .env up -d --no-build
# Images come from the registry (scripts/deploy-from-registry.ps1 -Stack us): web is the web-us image (built for /us), bff is the same image as India's.
# India-only channels (MSG91, WhatsApp, Razorpay, DLT) are deliberately absent: with no keys they stay switched off.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

services:
  bff:
    image: bhavano-us-bff:latest
    restart: unless-stopped
    logging: *default-logging
    environment:
      PORT: 4000
      MARKET: us
      DATABASE_URL: ${DATABASE_URL}
      # Where links in emails and in-app messages point (https://www.bhavano.com/us). Without it they point at India's site.
      PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://www.bhavano.com/us}
      # The US admin site's address, once there is one: the requirement digest links to it.
      ADMIN_SITE_URL: ${ADMIN_SITE_URL:-}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_IOS_CLIENT_ID: ${GOOGLE_IOS_CLIENT_ID:-}
      GOOGLE_ANDROID_CLIENT_ID: ${GOOGLE_ANDROID_CLIENT_ID:-}
      APPLE_BUNDLE_ID: ${APPLE_BUNDLE_ID:-}
      ADMIN_PHONES: ${ADMIN_PHONES:-}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      # Razorpay, charging in dollars (docs/plans/us-stripe-payments.md). Empty until the US sells.
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      EXPO_PUSH_ENABLED: ${EXPO_PUSH_ENABLED:-}
      EXPO_ACCESS_TOKEN: ${EXPO_ACCESS_TOKEN:-}
      # The US photo bucket and CDN: never India's.
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-}
      CDN_BASE_URL: ${CDN_BASE_URL:-}
      GOOGLE_MAPS_SERVER_KEY: ${GOOGLE_MAPS_SERVER_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      AI_LISTING_COPY_PROVIDER: ${AI_LISTING_COPY_PROVIDER:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
    volumes:
      - bff_logs:/app/apps/bff/logs
      - bff_video_tmp:/app/apps/bff/uploads
      - ./apps/bff/notification-templates:/app/apps/bff/notification-templates:ro
    expose:
      - "4000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  web:
    image: bhavano-us-web:latest
    restart: unless-stopped
    logging: *default-logging
    environment:
      MARKET: us
      BFF_INTERNAL_URL: http://bff:4000
      # www.bhavano.com/us is forwarded by India's Caddy, so its address ends every X-Forwarded-For: skip it to read the
      # visitor's (the same address Caddyfile.us trusts).
      TRUSTED_PROXY_IPS: ${INDIA_PROXY_IP:-13.205.0.54}
      # NEXT_PUBLIC_* are baked into the image at build time (US_NEXT_PUBLIC_* repository variables); these runtime copies are for server code.
      NEXT_PUBLIC_BFF_URL: ${NEXT_PUBLIC_BFF_URL}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      NEXT_PUBLIC_MARKET: us
      NEXT_PUBLIC_BASE_PATH: /us
      # The public address of the US sign-in route, under the shared host: https://www.bhavano.com/us/api/auth
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      AUTH_URL: ${NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      AUTH_SECRET: ${NEXTAUTH_SECRET}
      AUTH_TRUST_HOST: "true"
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    depends_on:
      bff:
        condition: service_healthy
    expose:
      - "3000"

  # The US admin site (docs/plans/us-admin-site.md). The same image as India's: it reads only the settings below.
  admin:
    image: bhavano-us-admin:latest
    restart: unless-stopped
    logging: *default-logging
    environment:
      MARKET: us
      BFF_INTERNAL_URL: http://bff:4000
      NEXTAUTH_URL: ${ADMIN_NEXTAUTH_URL:-}
      # Its own secret, not the website's.
      NEXTAUTH_SECRET: ${ADMIN_NEXTAUTH_SECRET:-}
      AUTH_TRUST_HOST: "true"
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    depends_on:
      bff:
        condition: service_healthy
    expose:
      - "3001"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      US_ORIGIN_DOMAIN: ${US_ORIGIN_DOMAIN}
      US_API_DOMAIN: ${US_API_DOMAIN}
      # Unset or empty: a name nobody can request, over plain HTTP, so the admin site stays unreachable and no certificate is asked for.
      US_ADMIN_DOMAIN: ${US_ADMIN_DOMAIN:-http://us-admin.invalid}
      # X-Robots-Tag on every US response; unset keeps "noindex, nofollow". Set to "all" at launch.
      US_ROBOTS_TAG: ${US_ROBOTS_TAG:-noindex, nofollow}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile.us:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web
      - bff

volumes:
  caddy-data:
  caddy-config:
  bff_logs:
  bff_video_tmp:
