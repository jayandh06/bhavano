services:
  bff:
    build:
      context: .
      dockerfile: apps/bff/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET}
      MSG91_AUTH_KEY: ${MSG91_AUTH_KEY}
      MSG91_SENDER_ID: ${MSG91_SENDER_ID}
      MSG91_DLT_TEMPLATE_ID: ${MSG91_DLT_TEMPLATE_ID}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      # The mobile apps' own OAuth clients — an id_token's `aud` is whichever client requested
      # it, so the web client ID alone rejects every native sign-in (see
      # GoogleProvider.acceptedAudiences's own comment). Both optional/blank until each
      # platform's sign-in is actually wired up and tested.
      GOOGLE_IOS_CLIENT_ID: ${GOOGLE_IOS_CLIENT_ID}
      GOOGLE_ANDROID_CLIENT_ID: ${GOOGLE_ANDROID_CLIENT_ID}
      # No admin signup flow exists — a phone/email matching one of these gets promoted
      # to role=admin automatically on login.
      ADMIN_PHONES: ${ADMIN_PHONES}
      ADMIN_EMAILS: ${ADMIN_EMAILS}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
      MSG91_TRANSACTIONAL_TEMPLATE_ID: ${MSG91_TRANSACTIONAL_TEMPLATE_ID}
      # WhatsApp via MSG91 — used only for the first-time-mobile-signup welcome (see
      # docs/plans/whatsapp-welcome-mobile-signups.md); every other WhatsApp send in this app
      # still goes through Meta's Cloud API directly, below. Unset disables just this one welcome
      # path (sends log and skip, falling back to the default email/Meta-WhatsApp welcome).
      MSG91_WHATSAPP_INTEGRATED_NUMBER: ${MSG91_WHATSAPP_INTEGRATED_NUMBER}
      MSG91_WHATSAPP_TEMPLATE_NAME: ${MSG91_WHATSAPP_TEMPLATE_NAME}
      MSG91_WHATSAPP_NAMESPACE: ${MSG91_WHATSAPP_NAMESPACE}
      # Ad-posted-confirmation WhatsApp — same MSG91 account/integrated number as the welcome
      # template above, but its own namespace: MSG91 issued this template (recreated as
      # "listing_posted" to add a location field) a different namespace than welcome's, so it
      # cannot reuse MSG91_WHATSAPP_NAMESPACE (see Msg91Provider.sendAdPostedConfirmation).
      MSG91_WHATSAPP_AD_POSTED_TEMPLATE_NAME: ${MSG91_WHATSAPP_AD_POSTED_TEMPLATE_NAME}
      MSG91_WHATSAPP_AD_POSTED_NAMESPACE: ${MSG91_WHATSAPP_AD_POSTED_NAMESPACE}
      # Promotional, not transactional — a different DLT template category and different consent
      # rules in India, which is exactly why this is a separate, explicit opt-in from every
      # MSG91_WHATSAPP_* var above (see OutreachSenderService's own doc comment). Nothing outreach
      # sends — OutreachService.sendClaimVerification, the campaign-send job — goes out unless
      # this is exactly "true". Unset/anything else disables it (fails closed).
      MSG91_MARKETING_ENABLED: ${MSG91_MARKETING_ENABLED}
      # The approved WhatsApp template for OutreachService.sendClaimVerification specifically —
      # "claim_listing" (renamed from "claim_listing_pg" on resubmission/re-approval as Utility
      # rather than Marketing, 2026-09-13), 5 positional body variables + a url button, WITH a
      # real namespace (confirmed against MSG91's own dashboard snippet — docs/plans/
      # pg-coworking-google-places-leadgen.md previously assumed this template sent namespace as
      # null like the welcome one; that assumption was wrong, corrected there too). Unset disables
      # just this one send (logs and skips), same degrade as every other MSG91_WHATSAPP_* var here.
      MSG91_WHATSAPP_CLAIM_TEMPLATE_NAME: ${MSG91_WHATSAPP_CLAIM_TEMPLATE_NAME}
      MSG91_WHATSAPP_CLAIM_NAMESPACE: ${MSG91_WHATSAPP_CLAIM_NAMESPACE}
      # Validates inbound MSG91 WhatsApp status webhooks — see WhatsappWebhookController and
      # .env.production.example's own comment on this var.
      MSG91_WEBHOOK_SECRET: ${MSG91_WEBHOOK_SECRET}
      # WhatsApp Business via Meta's Cloud API, direct rather than through MSG91 — the default
      # path for every WhatsApp send except the mobile welcome above. Unset disables WhatsApp
      # entirely (sends log and skip) — see .env.production.example for which id goes in
      # WHATSAPP_PHONE_NUMBER_ID, which is the easiest thing to get wrong here.
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN}
      WHATSAPP_WELCOME_TEMPLATE: ${WHATSAPP_WELCOME_TEMPLATE}
      WHATSAPP_API_VERSION: ${WHATSAPP_API_VERSION}
      WHATSAPP_TEMPLATE_LANGUAGE: ${WHATSAPP_TEMPLATE_LANGUAGE}
      # Photo storage — Cloudflare R2 (S3-compatible), served publicly through CDN_BASE_URL.
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET: ${R2_BUCKET}
      CDN_BASE_URL: ${CDN_BASE_URL}
      # Lets the bff purge a rotated listing photo's URL from Cloudflare's edge cache immediately
      # — optional, see docs/plans/listing-photo-orientation.md.
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN}
      CLOUDFLARE_ZONE_ID: ${CLOUDFLARE_ZONE_ID}
      # Razorpay — listing boosts (see docs/plans/monetization-boosted-listings-premium-tiers.md).
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET}
      # Google Maps — server-side reverse geocoding for the map pin-picker (see
      # docs/plans/google-maps-location-picker.md). Never sent to any client.
      GOOGLE_MAPS_SERVER_KEY: ${GOOGLE_MAPS_SERVER_KEY}
      # Google Ads — server-side conversion upload for signup/post-ad via the Data Manager API,
      # using the gclid captured by web's middleware.ts (see
      # docs/plans/server-side-google-ads-conversion-upload.md). Same OAuth client the root
      # ads_*.py scripts already use; GOOGLE_ADS_REFRESH_TOKEN must include the
      # datamanager scope (not just adwords) — see the plan doc's manual prerequisites. No
      # developer token needed here; Data Manager API doesn't use one.
      GOOGLE_ADS_CLIENT_ID: ${GOOGLE_ADS_CLIENT_ID}
      GOOGLE_ADS_CLIENT_SECRET: ${GOOGLE_ADS_CLIENT_SECRET}
      GOOGLE_ADS_REFRESH_TOKEN: ${GOOGLE_ADS_REFRESH_TOKEN}
      # Video upload/transcode temp storage (see docs/plans/listing-video-uploads.md) — reuses
      # the image's existing /app/apps/bff/uploads dir, given its own volume below so a container
      # restart mid-upload/transcode doesn't strand temp files in the writable layer.
      VIDEO_TMP_DIR: /app/apps/bff/uploads
      # MaxMind GeoLite2, for a best-effort city/region/country label on each Visit row (see
      # docs/plans/visit-ip-city-logging.md). Optional: unset, or pointing at a file that is not
      # there, simply leaves every visit's ipCity/ipRegion/ipCountry null.
      GEOIP_DB_PATH: /app/data/geoip/GeoLite2-City.mmdb
      # Where get_pg_coworking_leads.py's downloaded photos land when the scraper is run on this
      # same instance (see docs/deployment.md's "Direct listing creation from OutreachContact"
      # section) — OutreachService.createListingFromContact reads them straight off this path.
      # Unset, or a contact with no matching files here, just means that contact isn't eligible
      # for direct creation yet — never a hard error for the rest of the app.
      SCRAPED_PHOTOS_DIR: /app/leads_output/photos
    volumes:
      # Rotating request/response logs, shared read-only with the alloy container below —
      # see docs/plans/bff-loki-grafana-logging.md.
      - bff_logs:/app/apps/bff/logs
      - bff_video_tmp:/app/apps/bff/uploads
      # Notification email copy (see apps/bff/notification-templates/README.md). Bind-mounted
      # from the repo checkout on the host, not baked into the image, specifically so a wording
      # fix can be made by editing the file directly on the app host and takes effect on the next
      # notification sent — no rebuild, no restart. Read-only from the container's side (nothing
      # in the app ever writes here) — editing happens on the host filesystem directly, outside
      # Docker entirely, which :ro does nothing to prevent.
      - ./apps/bff/notification-templates:/app/apps/bff/notification-templates:ro
      # Bind mount rather than a baked-in file: the database is ~60MB and has to be refreshed
      # periodically under MaxMind's licence, so keeping it out of the image means a refresh is
      # ./scripts/update-geolite.sh + a bff restart, with no rebuild and no per-deploy disk cost.
      - ./data/geoip:/app/data/geoip:ro
      # get_pg_coworking_leads.py's default --photos-dir is ./leads_output relative to wherever
      # it's run — on the app instance, that's this same repo checkout, so ./leads_output/photos
      # here is exactly what SCRAPED_PHOTOS_DIR above points at inside the container. Read-only:
      # the container only ever reads these, the scraper (run directly on the host, not
      # containerized) is what writes them.
      - ./leads_output/photos:/app/leads_output/photos:ro
    expose:
      - "4000"
    ports:
      # Loopback-only — not 0.0.0.0:4000 — so get_pg_coworking_leads.py /
      # get_pg_coworking_leads_apify.py (run directly on this host, not containerized) can reach
      # the BFF at http://localhost:4000 as docs/deployment.md documents, without exposing the
      # BFF (which has unauthenticated-by-design endpoints like reverse-geocode, and admin
      # endpoints gated only by JWT) to anything outside this instance. Caddy already reaches it
      # over the internal Docker network regardless of this — this is purely for host-side
      # scripts.
      - "127.0.0.1:4000:4000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_BFF_URL: ${NEXT_PUBLIC_BFF_URL}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_GTM_ID: ${NEXT_PUBLIC_GTM_ID}
        NEXT_PUBLIC_GOOGLE_MAPS_JS_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_JS_KEY}
    restart: unless-stopped
    environment:
      # Server-side fetches from the web app's Next.js server go straight to the bff
      # container over the compose network — never through the public internet.
      BFF_INTERNAL_URL: http://bff:4000
      # The browser talks to the bff directly only for the WebSocket (messaging) connection,
      # so this one has to be the public bff URL, not the internal one above.
      NEXT_PUBLIC_BFF_URL: ${NEXT_PUBLIC_BFF_URL}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      NEXT_PUBLIC_GTM_ID: ${NEXT_PUBLIC_GTM_ID}
      # Google Maps JavaScript API + Places — the posting flow's map pin-picker (see
      # docs/plans/google-maps-location-picker.md). HTTP-referrer restricted, safe for the
      # browser — never reuse GOOGLE_MAPS_SERVER_KEY (bff, above) here.
      NEXT_PUBLIC_GOOGLE_MAPS_JS_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_JS_KEY}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      # Required behind a reverse proxy (Caddy) — otherwise NextAuth v5 rejects every
      # request with "UntrustedHost" since the forwarded Host header isn't localhost.
      AUTH_TRUST_HOST: "true"
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
    depends_on:
      bff:
        condition: service_healthy
    expose:
      - "3000"

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    restart: unless-stopped
    environment:
      BFF_INTERNAL_URL: http://bff:4000
      NEXTAUTH_URL: ${ADMIN_NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${ADMIN_NEXTAUTH_SECRET}
      AUTH_TRUST_HOST: "true"
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
    depends_on:
      bff:
        condition: service_healthy
    expose:
      - "3001"

  # --- Logging / observability (docs/plans/bff-loki-grafana-logging.md) ---
  # Alloy tails the BFF's rotating log files off the shared `bff_logs` volume and ships them
  # into Loki. (Promtail is in Grafana's own maintenance mode now — Alloy is the recommended
  # replacement for any new log-shipping setup.)
  alloy:
    image: grafana/alloy:latest
    restart: unless-stopped
    volumes:
      - bff_logs:/var/log/bff:ro
      - ./observability/alloy-config.alloy:/etc/alloy/config.alloy:ro
    command: run --server.http.listen-addr=0.0.0.0:12345 /etc/alloy/config.alloy
    depends_on:
      - loki

  loki:
    image: grafana/loki:latest
    restart: unless-stopped
    volumes:
      - ./observability/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    expose:
      - "3100"

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: https://${LOGS_DOMAIN}
      # Every dashboard/Explore view reads in IST regardless of who's looking or from where —
      # this is an India-only platform, timestamps should never silently show UTC/browser-local.
      GF_DATE_FORMATS_DEFAULT_TIMEZONE: Asia/Kolkata
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - loki
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
      API_DOMAIN: ${API_DOMAIN}
      APEX_DOMAIN: ${APEX_DOMAIN}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN}
      LOGS_DOMAIN: ${LOGS_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web
      - bff
      - admin
      - grafana

volumes:
  caddy-data:
  caddy-config:
  bff_logs:
  bff_video_tmp:
  loki_data:
  grafana_data:
