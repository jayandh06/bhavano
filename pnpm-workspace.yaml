packages:
  - "apps/*"
  - "packages/*"
# Prebuilt iOS binaries must share one ExpoModulesCore ABI.
# expo-font 57.0.0, expo-location 57.0.2, and expo-file-system 57.0.0 call
# _decorateModule(object:in:appContext:), which core 57.0.3 exports.
# file-system 57.0.1+ switched that signature, and 57.0.2+ also calls willDestroy,
# which 57.0.3 does not define. Keep this pair together.
overrides:
  expo-file-system: 57.0.0
  expo-modules-core: 57.0.3
allowBuilds:
  '@prisma/engines': true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true
